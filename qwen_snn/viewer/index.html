<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spiking Qwen Viewer</title>
<style>
  :root {
    --bg: #07090d; --panel: rgba(14, 18, 26, 0.92); --line: #253042; --text: #d8dee9; --muted: #7d8899;
    --accent: #ffb347; --pos: #ff9f43; --neg: #4aa3ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  canvas { display: block; }
  .panel { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    backdrop-filter: blur(6px); }
  #head { top: 12px; left: 12px; padding: 10px 14px; max-width: 340px; }
  #head h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  #head .sub { color: var(--muted); font-size: 12px; }
  #help { color: var(--muted); font-size: 11.5px; margin-top: 6px; }
  #help b { color: var(--text); font-weight: 600; }
  #nav { top: 118px; left: 12px; bottom: 150px; width: 220px; overflow-y: auto; padding: 8px 6px; }
  #nav .blk { margin: 0 0 2px; }
  #nav .blk > div { padding: 2px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  #nav .blk > div:hover { background: #1b2433; }
  #nav .bname { font-weight: 600; }
  #nav .pname { padding-left: 18px !important; color: var(--muted); font-size: 12px; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 0; }
  #insp { top: 12px; right: 12px; width: 360px; max-height: calc(100% - 174px); overflow-y: auto; padding: 12px 14px;
    display: none; }
  #insp h2 { margin: 0 0 4px; font-size: 15px; font-weight: 600; word-break: break-all; }
  #insp .kv { display: grid; grid-template-columns: 110px 1fr; gap: 2px 8px; margin: 8px 0; font-size: 12.5px; }
  #insp .kv span:nth-child(odd) { color: var(--muted); }
  #insp h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 12px 0 4px; }
  .syn { display: grid; grid-template-columns: 1fr 58px 54px; gap: 6px; align-items: center; padding: 2px 4px;
    border-radius: 5px; cursor: pointer; font-size: 12px; }
  .syn:hover { background: #1b2433; }
  .syn .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .syn .w { text-align: right; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; border-radius: 3px; }
  #close { position: absolute; top: 8px; right: 10px; cursor: pointer; color: var(--muted); font-size: 16px; }
  #bottom { left: 12px; right: 12px; bottom: 12px; padding: 10px 12px; }
  #runrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #prompt { flex: 1 1 260px; min-width: 0; background: #0c1119; border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 7px 10px; font: inherit; }
  select, input[type=number] { background: #0c1119; border: 1px solid var(--line); color: var(--text);
    border-radius: 7px; padding: 6px; font: inherit; }
  input[type=number] { width: 64px; }
  button { background: var(--accent); color: #1a1205; border: 0; border-radius: 7px; padding: 7px 14px;
    font: inherit; font-weight: 600; cursor: pointer; }
  button.ghost { background: #1b2433; color: var(--text); }
  button:disabled { opacity: .5; cursor: default; }
  label { color: var(--muted); font-size: 12px; }
  #play { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  #slider { flex: 1; }
  #tokens { margin-top: 8px; max-height: 64px; overflow-y: auto; font-size: 13px; line-height: 1.7; }
  .tk { padding: 1px 2px; border-radius: 3px; cursor: pointer; white-space: pre-wrap; }
  .tk.prompt { color: var(--muted); }
  .tk.cur { background: var(--accent); color: #1a1205; }
  #status { color: var(--muted); font-size: 12px; min-width: 160px; }
  #frameinfo { color: var(--muted); font-size: 12px; margin-top: 4px; min-height: 17px; }
  #tip { position: absolute; z-index: 20; pointer-events: none; padding: 4px 8px; font-size: 12px; display: none;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .label3d { position: absolute; z-index: 1; pointer-events: none; font-size: 11px; color: #9aa6b8; transform: translate(-50%, -100%);
    white-space: nowrap; text-shadow: 0 0 4px #000; }
  @media (max-width: 760px) { #nav { display: none; } #insp { width: calc(100% - 24px); max-height: 40%; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="head" class="panel">
  <h1>Spiking Qwen3.5-0.8B</h1>
  <div class="sub" id="stats">loading…</div>
  <div id="help"><b>drag</b> orbit · <b>right-drag</b> pan · <b>scroll</b> zoom · <b>WASD/QE</b> fly (shift = fast) ·
    <b>click</b> a neuron</div>
</div>
<div id="nav" class="panel"></div>
<div id="insp" class="panel"><span id="close">×</span><div id="inspbody"></div></div>
<div id="bottom" class="panel">
  <div id="runrow">
    <input id="prompt" value="Why is the sky blue?" placeholder="Type a prompt">
    <label>mode <select id="mode"><option value="spike">LIF spikes</option><option value="graded">graded</option></select></label>
    <label>T <input id="T" type="number" value="32" min="1" max="256"></label>
    <label>tokens <input id="maxnew" type="number" value="24" min="0" max="400"></label>
    <button id="run">Run</button>
    <span id="status"></span>
  </div>
  <div id="play">
    <button id="pp" class="ghost" disabled>Play</button>
    <input id="slider" type="range" min="0" max="0" value="0" disabled>
    <label><input id="sweep" type="checkbox" checked> wavefront</label>
  </div>
  <div id="frameinfo"></div>
  <div id="tokens"></div>
</div>
<div id="tip"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const COLORS = { token: "#8fa3bf", integrator: "#2ec4b6", rmsnorm: "#ffd166", gdn: "#b388ff",
                 attention: "#ff5fa2", swiglu: "#7bd389", readout: "#ff9f43" };
const $ = (id) => document.getElementById(id);
const layout = await (await fetch("/api/layout")).json();
const pops = layout.populations;
const N = layout.n_neurons;
$("stats").textContent = `${N.toLocaleString()} neurons · ${layout.n_synapses.toLocaleString()} packed synapses` +
  (layout.calibrated ? "" : " · uncalibrated");

// ---------------------------------------------------------------- layout: populations as sheets along x
const positions = new Float32Array(N * 3);
const baseColor = new Float32Array(N * 3);
const popX = {};
let x = 0;
function blockOf(name) { const m = name.match(/^L(\d+)\./); return m ? +m[1] : null; }
let lastBlock = null;
for (const p of pops) {
  const big = p.n > 100000;
  const sp = big ? 0.28 : 1.0;
  const b = blockOf(p.name);
  if (big) x += 40; else if (b !== lastBlock) x += 14; else x += 7;
  lastBlock = b;
  const cols = Math.ceil(Math.sqrt(p.n * (big ? 1 : 1.0)));
  const rows = Math.ceil(p.n / cols);
  const c = new THREE.Color(COLORS[p.type] || "#ffffff").multiplyScalar(big ? 0.45 : 1.0);
  for (let i = 0; i < p.n; i++) {
    const g = p.neuron_offset + i;
    const r = Math.floor(i / cols), k = i % cols;
    positions[3 * g] = x;
    positions[3 * g + 1] = (rows / 2 - r) * sp;
    positions[3 * g + 2] = (k - cols / 2) * sp;
    baseColor[3 * g] = c.r; baseColor[3 * g + 1] = c.g; baseColor[3 * g + 2] = c.b;
  }
  popX[p.name] = { x, h: rows * sp, w: cols * sp, p };
  if (big) x += 40;
}
const xMax = x;

// ---------------------------------------------------------------- scene
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x07090d);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.screenSpacePanning = true;

const geo = new THREE.BufferGeometry();
geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
geo.setAttribute("color", new THREE.BufferAttribute(baseColor, 3));
const activity = new Uint8Array(N);
const actAttr = new THREE.BufferAttribute(activity, 1, true);
actAttr.setUsage(THREE.DynamicDrawUsage);
geo.setAttribute("act", actAttr);
const uniforms = { uScale: { value: innerHeight / 2 }, uSweep: { value: 1e9 }, uHasRun: { value: 0 } };
const mat = new THREE.ShaderMaterial({
  uniforms, transparent: true, depthWrite: true,
  vertexShader: `
    attribute float act; attribute vec3 color;
    uniform float uScale, uSweep, uHasRun;
    varying vec3 vCol; varying float vA;
    void main() {
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      float a = position.x < uSweep ? act : 0.0;
      float front = uHasRun * smoothstep(9.0, 0.0, abs(position.x - uSweep)) * 0.35;
      float lit = max(a, front);
      vCol = color * (uHasRun > 0.5 ? 0.16 + 0.84 * lit : 0.55) + vec3(lit * lit * 0.55);
      vA = 1.0;
      gl_PointSize = clamp((0.6 + 0.9 * lit) * uScale / -mv.z, 1.0, 14.0);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vCol; varying float vA;
    void main() {
      vec2 d = gl_PointCoord - 0.5;
      if (dot(d, d) > 0.25) discard;
      gl_FragColor = vec4(vCol, vA);
    }`,
});
const cloud = new THREE.Points(geo, mat);
scene.add(cloud);

// selected neuron marker + synapse lines
const marker = new THREE.Mesh(new THREE.RingGeometry(1.1, 1.5, 32),
  new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
marker.visible = false;
scene.add(marker);
const lineGeo = new THREE.BufferGeometry();
const lines = new THREE.LineSegments(lineGeo, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.85 }));
scene.add(lines);

// block labels
const labels = [];
function addLabel(text, px, py, pz) {
  const d = document.createElement("div");
  d.className = "label3d"; d.textContent = text; document.body.appendChild(d);
  labels.push({ d, v: new THREE.Vector3(px, py, pz) });
}
{
  const seen = new Set();
  for (const p of pops) {
    const b = blockOf(p.name);
    const P = popX[p.name];
    if (b === null) addLabel(p.name === "token" ? "token neurons (inputs)" : p.name === "vocab" ? "vocab neurons (readout)" : p.name,
                             P.x, P.h / 2 + 4, 0);
    else if (!seen.has(b)) { seen.add(b); addLabel(`L${b} · ${pops.find(q => q.name === `L${b}.gdn`) ? "DeltaNet" : "attention"}`, P.x + 17, 40, 0); }
  }
}

function home() {
  controls.target.set(xMax * 0.42, 0, 0);
  camera.position.set(0, xMax * 0.3, xMax * 0.62);
}
home();

// ---------------------------------------------------------------- navigator
const nav = $("nav");
function flyTo(px, py, pz, dist = 60) {
  const target = new THREE.Vector3(px, py, pz);
  const dir = camera.position.clone().sub(controls.target).normalize();
  tween = { t0: performance.now(), fromT: controls.target.clone(), toT: target,
            fromC: camera.position.clone(), toC: target.clone().add(dir.multiplyScalar(dist)) };
}
let tween = null;
{
  let cur = null, curDiv = null;
  const mk = (cls, html, onclick) => { const d = document.createElement("div"); d.className = cls; d.innerHTML = html; d.onclick = onclick; return d; };
  for (const p of pops) {
    const b = blockOf(p.name);
    const dot = `<span class="dot" style="background:${COLORS[p.type]}"></span>`;
    const go = () => { const P = popX[p.name]; flyTo(P.x, 0, 0, Math.max(40, P.w * 1.4)); };
    if (b === null) {
      const blk = document.createElement("div"); blk.className = "blk";
      blk.appendChild(mk("bname", `${dot}${p.name} <span style="color:var(--muted)">${p.n.toLocaleString()}</span>`, go));
      nav.appendChild(blk); cur = null;
      continue;
    }
    if (cur !== b) {
      cur = b; curDiv = document.createElement("div"); curDiv.className = "blk";
      const isAttn = !!pops.find(q => q.name === `L${b}.attn`);
      curDiv.appendChild(mk("bname", `L${b} <span style="color:var(--muted)">${isAttn ? "attention" : "DeltaNet"}</span>`, () => {
        const P = popX[`L${b}.attn_norm`]; flyTo(P.x + 17, 0, 0, 110); }));
      nav.appendChild(curDiv);
    }
    curDiv.appendChild(mk("pname", `${dot}${p.name.split(".")[1]} <span>${p.n.toLocaleString()}</span>`, go));
  }
}

// ---------------------------------------------------------------- picking + inspector
const ray = new THREE.Raycaster();
const mouse = new THREE.Vector2();
function pick(ev) {
  mouse.set((ev.clientX / innerWidth) * 2 - 1, -(ev.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const d = camera.position.distanceTo(controls.target);
  ray.params.Points.threshold = Math.max(0.12, d / 900);
  const hits = ray.intersectObject(cloud);
  if (!hits.length) return null;
  // nearest to the ray among the closest few
  const near = hits.slice(0, 12).sort((a, b) => a.distanceToRay - b.distanceToRay);
  return near[0].index;
}
function popOf(g) { let lo = 0, hi = pops.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (pops[m].neuron_offset <= g) lo = m; else hi = m - 1; } return pops[lo]; }
let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || e.button !== 0) return;
  if (Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 4) return;
  const g = pick(e);
  if (g !== null) select(g, false);
});
let tipTimer = 0;
renderer.domElement.addEventListener("pointermove", (e) => {
  const now = performance.now();
  if (now - tipTimer < 120 || e.buttons) { if (e.buttons) $("tip").style.display = "none"; return; }
  tipTimer = now;
  const g = pick(e);
  const tip = $("tip");
  if (g === null) { tip.style.display = "none"; return; }
  const p = popOf(g);
  tip.style.display = "block";
  tip.style.left = e.clientX + 14 + "px"; tip.style.top = e.clientY + 10 + "px";
  tip.textContent = `${p.name}[${g - p.neuron_offset}]` + (frames.length ? ` · activity ${(activity[g] / 255).toFixed(2)}` : "");
});

const fmt = (v) => (Math.abs(v) >= 100 ? v.toFixed(0) : Math.abs(v) >= 1 ? v.toFixed(3) : v.toPrecision(3));
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
async function select(g, fly) {
  const info = await (await fetch(`/api/neuron/${g}?k=24`)).json();
  if (info.error) { $("status").textContent = info.error; return; }
  marker.visible = true;
  marker.position.set(positions[3 * g], positions[3 * g + 1], positions[3 * g + 2]);
  marker.lookAt(camera.position);
  const P = (i) => [positions[3 * i], positions[3 * i + 1], positions[3 * i + 2]];
  const pts = [], cols = [];
  const maxW = Math.max(1e-9, ...info.out.map(e => Math.abs(e.weight)), ...info.in.map(e => Math.abs(e.weight)));
  const pos = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--pos"));
  const neg = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--neg"));
  const push = (a, b, w) => {
    const c = (w >= 0 ? pos : neg).clone().multiplyScalar(0.25 + 0.75 * Math.abs(w) / maxW);
    pts.push(...P(a), ...P(b)); cols.push(c.r, c.g, c.b, c.r, c.g, c.b);
  };
  for (const e of info.out) push(g, e.target, e.weight);
  for (const e of info.in) push(e.source, g, e.weight);
  lineGeo.setAttribute("position", new THREE.Float32BufferAttribute(pts, 3));
  lineGeo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
  lineGeo.computeBoundingSphere();
  if (fly) flyTo(...P(g), 45);

  const kv = [["type", info.type], ["index", `${info.index.toLocaleString()} of ${info.n.toLocaleString()}`],
              ["global id", info.gid.toLocaleString()]];
  if (info.token !== undefined) kv.push(["token", JSON.stringify(info.token)]);
  if (info.range !== undefined) kv.push(["drive range", fmt(info.range)], ["threshold (T=32)", fmt(info.threshold_T32)],
                                        ["leak / step", info.leak], ["refractory", `${info.refractory} steps`]);
  if (info.spike_amplitude !== undefined) kv.push(["spike amplitude", fmt(info.spike_amplitude)]);
  kv.push(["fan-out", `${info.fan_out.toLocaleString()} synapses`], ["fan-in", `${info.fan_in.toLocaleString()} synapses`]);
  if (frames.length) kv.push(["activity now", (activity[g] / 255).toFixed(2)]);
  const row = (e, id, lbl) => {
    const wv = Math.abs(e.weight) / maxW;
    const col = e.weight >= 0 ? "var(--pos)" : "var(--neg)";
    return `<div class="syn" data-g="${id}" title="int8 ${e.int8} → weight ${e.weight}">
      <span class="lbl">${esc(lbl)}</span>
      <span class="w" style="color:${col}">${e.int8 > 0 ? "+" : ""}${e.int8}</span>
      <div class="bar" style="width:${Math.max(4, 54 * wv)}px;background:${col}"></div></div>`;
  };
  $("inspbody").innerHTML = `<h2>${esc(info.pop)}[${info.index}]</h2>
    <div class="kv">${kv.map(([k, v]) => `<span>${k}</span><span>${esc(v)}</span>`).join("")}</div>
    ${info.out.length ? `<h3>strongest outgoing synapses</h3>${info.out.map(e => row(e, e.target, "→ " + e.label)).join("")}` : ""}
    ${info.in.length ? `<h3>strongest incoming synapses</h3>${info.in.map(e => row(e, e.source, "← " + e.label)).join("")}` : ""}
    <div style="color:var(--muted);font-size:11.5px;margin-top:10px">int8 is the packed weight byte (÷127, × the target slot's gain).
    Click a synapse to follow it.</div>`;
  $("insp").style.display = "block";
  for (const el of $("inspbody").querySelectorAll(".syn")) el.onclick = () => select(+el.dataset.g, true);
}
$("close").onclick = () => { $("insp").style.display = "none"; marker.visible = false; lineGeo.deleteAttribute("position"); };

// ---------------------------------------------------------------- runs
let frames = [], cur = -1, playing = false, sweepT = 1, sweepStart = 0, lastTop = [];
const [LO, HI] = layout.activity_range;
function decode(b64) { const s = atob(b64); const a = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }
function show(k, animate) {
  const f = frames[k];
  if (!f) return;
  cur = k;
  activity.fill(0, 0, LO);
  for (const t of lastTop) activity[t] = 0;
  if (!f.bytes) f.bytes = decode(f.activity);
  activity.set(f.bytes, LO);
  activity[f.token] = 255;
  lastTop = f.top.map(t => t.gid);
  for (const t of f.top) activity[t.gid] = Math.min(255, Math.round(255 * Math.sqrt(t.p)));
  actAttr.needsUpdate = true;
  uniforms.uHasRun.value = 1;
  sweepT = animate && $("sweep").checked ? 0 : 1;
  sweepStart = performance.now();
  $("slider").value = k;
  for (const el of document.querySelectorAll(".tk")) el.classList.toggle("cur", +el.dataset.k === k);
  const top = f.top.slice(0, 5).map(t => `${JSON.stringify(t.text)} ${(100 * t.p).toFixed(0)}%`).join(", ");
  $("frameinfo").textContent = `token ${k + 1}/${frames.length} ${JSON.stringify(f.text)} (${f.phase}) · ` +
    (f.spikes ? `${f.spikes.toLocaleString()} spikes · ` : "") + `${f.seconds}s · next: ${top}`;
}
function addTokens(newFrames) {
  const box = $("tokens");
  for (const f of newFrames) {
    const s = document.createElement("span");
    s.className = "tk " + f.phase; s.dataset.k = f.index; s.textContent = f.text;
    s.onclick = () => { playing = false; $("pp").textContent = "Play"; show(f.index, true); };
    box.appendChild(s);
  }
  box.scrollTop = box.scrollHeight;
}
$("run").onclick = async () => {
  $("run").disabled = true;
  frames = []; cur = -1; $("tokens").innerHTML = ""; $("frameinfo").textContent = "";
  const r = await (await fetch("/api/run", { method: "POST", body: JSON.stringify({
    prompt: $("prompt").value, mode: $("mode").value, T: +$("T").value, max_new_tokens: +$("maxnew").value }) })).json();
  let done = false;
  while (!done) {
    const s = await (await fetch(`/api/frames?run=${r.run}&since=${frames.length}`)).json();
    const nf = s.frames;
    frames.push(...nf);
    addTokens(nf);
    $("status").textContent = s.error ? `error: ${s.error}` : s.status === "running" ? `running · ${frames.length} tokens` : s.status;
    if (nf.length) { $("slider").max = frames.length - 1; $("slider").disabled = false; $("pp").disabled = false; show(frames.length - 1, true); }
    done = s.done;
    if (!done) await new Promise(res => setTimeout(res, nf.length ? 50 : 400));
  }
  $("run").disabled = false;
};
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") $("run").click(); });
$("slider").oninput = () => { playing = false; $("pp").textContent = "Play"; show(+$("slider").value, false); };
$("pp").onclick = () => { playing = !playing; $("pp").textContent = playing ? "Pause" : "Play"; if (playing && cur >= frames.length - 1) show(0, true); };

// ---------------------------------------------------------------- keys + loop
const keys = new Set();
addEventListener("keydown", (e) => { if (e.target.tagName !== "INPUT") keys.add(e.key.toLowerCase()); });
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
addEventListener("blur", () => keys.clear());
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); uniforms.uScale.value = innerHeight / 2;
});
const clock = new THREE.Clock();
let holdT = 0;
function loop() {
  const dt = Math.min(0.05, clock.getDelta());
  if (keys.size) {
    const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
    const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
    const v = new THREE.Vector3();
    if (keys.has("w")) v.add(fwd); if (keys.has("s")) v.sub(fwd);
    if (keys.has("d")) v.add(right); if (keys.has("a")) v.sub(right);
    if (keys.has("e")) v.y += 1; if (keys.has("q")) v.y -= 1;
    const speed = (keys.has("shift") ? 400 : 90) * dt;
    v.multiplyScalar(speed);
    camera.position.add(v); controls.target.add(v); tween = null;
  }
  if (tween) {
    const u = Math.min(1, (performance.now() - tween.t0) / 700);
    const s = u * u * (3 - 2 * u);
    controls.target.lerpVectors(tween.fromT, tween.toT, s);
    camera.position.lerpVectors(tween.fromC, tween.toC, s);
    if (u >= 1) tween = null;
  }
  if (sweepT < 1) { sweepT = Math.min(1, (performance.now() - sweepStart) / 750); }
  uniforms.uSweep.value = sweepT >= 1 ? 1e9 : -60 + sweepT * (xMax + 120);
  if (playing && sweepT >= 1) {
    holdT += dt;
    if (holdT > 0.35) { holdT = 0; if (cur < frames.length - 1) show(cur + 1, true); else { playing = false; $("pp").textContent = "Play"; } }
  }
  if (marker.visible) marker.lookAt(camera.position);
  controls.update();
  renderer.render(scene, camera);
  const placed = [];
  for (const l of labels) {
    const p = l.v.clone().project(camera);
    const sx = (p.x + 1) / 2 * innerWidth, sy = (1 - p.y) / 2 * innerHeight;
    const vis = p.z < 1 && Math.abs(p.x) < 1.1 && Math.abs(p.y) < 1.1 &&
                !placed.some(([ax, ay]) => Math.abs(ax - sx) < 70 && Math.abs(ay - sy) < 16);
    l.d.style.display = vis ? "block" : "none";
    if (vis) { placed.push([sx, sy]); l.d.style.left = sx + "px"; l.d.style.top = sy + "px"; }
  }
  requestAnimationFrame(loop);
}
loop();
window.__viewer = { select, show, frames: () => frames, flyTo, popX };
</script>
