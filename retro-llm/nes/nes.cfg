MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    OAMRAM: start = $0200, size = $0100, type = rw;
    RAM:    start = $0300, size = $0500, type = rw;
    WRAM:   start = $6000, size = $2000, type = rw;
    HDR:    start = $0000, size = $0010, type = ro, file = %O, fill = yes;
    PRG0:   start = $8000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    PRG1:   start = $C000, size = $4000, type = ro, file = %O, fill = yes, fillval = $FF;
    CHR:    start = $0000, size = $2000, type = ro, file = %O, fill = yes;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    OAM:      load = OAMRAM, type = bss, align = $100;
    BSS:      load = RAM,    type = bss;
    WRAM:     load = WRAM,   type = bss;
    HEADER:   load = HDR,    type = ro;
    WEIGHTS0: load = PRG0,   type = ro;
    TABLES:   load = PRG1,   type = ro, align = $100;
    RODATA:   load = PRG1,   type = ro;
    CODE:     load = PRG1,   type = ro;
    RAMCODE:  load = PRG1, run = RAM, type = rw, define = yes;
    VECTORS:  load = PRG1,   type = ro, start = $FFFA;
    CHARS:    load = CHR,    type = ro;
}
