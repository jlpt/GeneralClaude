<title>DNA Brain Mini</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: brain and world side by side, controls under them, then the champion's DNA and rules. */
:root {
  --bg: #f4f3f7; --panel: #ffffff; --ink: #1d1a26; --muted: #666173; --line: #dcd8e4; --accent: #5b36b8;
  --sensor: #0b7fa8; --motor: #c4470f; --t0: #b3197c; --t1: #2f8a33; --t2: #9a7400; --t3: #3d5fc4;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1018; --panel: #171926; --ink: #e9e7f1; --muted: #9b98ad; --line: #2a2d40; --accent: #a48fff;
    --sensor: #3fd2ff; --motor: #ff8f52; --t0: #ff62c8; --t1: #6eea70; --t2: #ffd83f; --t3: #8fa8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1018; --panel: #171926; --ink: #e9e7f1; --muted: #9b98ad; --line: #2a2d40; --accent: #a48fff;
  --sensor: #3fd2ff; --motor: #ff8f52; --t0: #ff62c8; --t1: #6eea70; --t2: #ffd83f; --t3: #8fa8ff;
  color-scheme: dark;
}
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 40px;
}
main { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
h1 { margin: 0; font-size: 1.6rem; }
p { margin: 0; color: var(--muted); max-width: 70ch; }
.views { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .views { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); } }
canvas { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: block; }
#brain { aspect-ratio: 1; }
#world { aspect-ratio: 2.2; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
button.go { background: var(--accent); border-color: var(--accent); color: var(--bg); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#stats { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
pre { margin: 0; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  font: 12.5px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
</style>

<main>
  <h1>DNA Brain Mini</h1>
  <p>A small version of the neurogenesis demos. DNA becomes rules, the rules grow a brain on a grid, the brain moves a creature along a line to food, and evolution keeps the DNA that collects the most food.</p>
  <div class="views">
    <canvas id="brain" aria-label="The brain: squares are sensors and motors, circles are grown neurons"></canvas>
    <canvas id="world" aria-label="The creature on a line, and the food"></canvas>
  </div>
  <div class="controls">
    <button id="evolve" class="go" type="button">Start evolving</button>
    <button id="reset" type="button">Start over</button>
    <span id="stats"></span>
  </div>
  <pre id="dna"></pre>
  <pre id="rules"></pre>
</main>

<script>
// ===== STEP 1: read the DNA into genes =====
// A gene starts at ATG and ends at a stop codon. Each codon (3 letters) becomes a number 0–63.
const BASES = 'ACGT', STOPS = ['TAA', 'TAG', 'TGA'], MAX_GENES = 4;

function readGenes(dna) {
  const genes = [];
  let start = dna.indexOf('ATG');
  while (start >= 0 && genes.length < MAX_GENES) {
    const codons = [];
    let i = start + 3;
    for (; i + 3 <= dna.length; i += 3) {
      const codon = dna.slice(i, i + 3);
      if (STOPS.includes(codon)) break;
      codons.push(BASES.indexOf(codon[0]) * 16 + BASES.indexOf(codon[1]) * 4 + BASES.indexOf(codon[2]));
    }
    if (codons.length) genes.push(codons);
    start = dna.indexOf('ATG', i + 3);
  }
  return genes;
}

// ===== STEP 2: turn each gene into the rules for one neuron type =====
// Each codon sets one rule. A short gene reuses its codons from the start.
function decodeGene(codons, nTypes) {
  const c = k => codons[k % codons.length];
  return {
    divisions: c(0) % 4,                                  // daughters each neuron of this type makes (0–3)
    direction: c(1) % 4,                                  // where the first daughter goes: right, down, left, up
    childType: c(2) % nTypes,                             // which type the daughters are
    reach: 1 + c(3) % 4,                                  // how many cells its connections reach (1–4)
    targets: c(4) % (1 << nTypes) || (1 << nTypes) - 1,   // which types it connects to (bit k = type k)
    weight: (c(5) - 32) / 16,                             // its synapses onto other neurons, −2 to +2
    sensorWeight: (c(6) - 32) / 16,                       // how strongly it listens to nearby sensors
    motorWeight: (c(7) - 32) / 16,                        // how strongly it drives nearby motors
    threshold: 0.5 + c(8) / 64,                           // charge needed to spike, 0.5–1.5
  };
}

// ===== STEP 3: grow the brain on a grid (the cellular automaton) =====
// Start from one cell. Every step, each cell with divisions left puts a daughter in a neighbouring cell.
const SIZE = 9, MAX_NEURONS = 40;
const SENSORS = [{ x: 2, y: 0, name: 'food left' }, { x: 6, y: 0, name: 'food right' }];
const MOTORS = [{ x: 2, y: 8, name: 'go left' }, { x: 6, y: 8, name: 'go right' }];
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

function grow(dna) {
  const genes = readGenes(dna);
  if (!genes.length) return null;
  const rules = genes.map(g => decodeGene(g, genes.length));
  const neurons = [{ x: 4, y: 4, type: 0, made: 0 }];       // the zygote: one type-0 cell in the middle
  const taken = (x, y) => [...neurons, ...SENSORS, ...MOTORS].some(n => n.x === x && n.y === y);
  for (let step = 0; step < 10; step++) {
    for (const n of [...neurons]) {                          // a copy, so cells born this step wait for the next
      const r = rules[n.type];
      if (n.made >= r.divisions || neurons.length >= MAX_NEURONS) continue;
      const [dx, dy] = DIRS[(r.direction + n.made) % 4];     // each daughter goes a quarter-turn further round
      const x = n.x + dx, y = n.y + dy;
      n.made++;
      if (x < 0 || y < 0 || x >= SIZE || y >= SIZE || taken(x, y)) continue;
      neurons.push({ x, y, type: r.childType, made: 0 });
    }
  }
  return wire(rules, neurons);
}

// ===== STEP 4: wire it up =====
// Each neuron connects to everything within its reach: neurons of the types it targets, sensors, and motors.
function wire(rules, neurons) {
  const near = (a, b, reach) => Math.hypot(a.x - b.x, a.y - b.y) <= reach;
  const brain = { rules, neurons, links: [], inputs: [], outputs: [] };
  neurons.forEach((a, i) => {
    const r = rules[a.type];
    neurons.forEach((b, j) => {
      if (i !== j && (r.targets >> b.type) & 1 && near(a, b, r.reach)) brain.links.push({ from: i, to: j, weight: r.weight });
    });
    SENSORS.forEach((s, k) => { if (near(a, s, r.reach)) brain.inputs.push({ sensor: k, to: i, weight: r.sensorWeight }); });
    MOTORS.forEach((m, k) => { if (near(a, m, r.reach)) brain.outputs.push({ from: i, motor: k, weight: r.motorWeight }); });
  });
  return brain;
}

// ===== STEP 5: run the spiking brain for one tick =====
// Each neuron keeps a charge. It leaks a little, adds its input, and spikes (then resets) above its threshold.
// Spikes reach other neurons and the motors on the next tick.
function think(brain, state, sensorValues) {
  const input = brain.neurons.map(() => 0);
  for (const s of brain.inputs) input[s.to] += s.weight * sensorValues[s.sensor];
  for (const l of brain.links) if (state.spikes[l.from]) input[l.to] += l.weight;
  const motors = [0, 0];
  for (const o of brain.outputs) if (state.spikes[o.from]) motors[o.motor] += o.weight;
  brain.neurons.forEach((n, i) => {
    state.charge[i] = state.charge[i] * 0.8 + input[i];
    state.spikes[i] = state.charge[i] >= brain.rules[n.type].threshold;
    if (state.spikes[i]) state.charge[i] = 0;
  });
  return motors;
}

// ===== STEP 6: the world, and how good a brain is =====
// The creature lives on a line from 0 to 100. Eating the food makes new food appear somewhere else.
// The score is food eaten, plus a little credit for moving toward the food. Without that credit almost
// every random brain scores 0, and evolution has nothing to tell the near-misses from the hopeless.
const TICKS = 300, TEST_WORLDS = [1, 2, 3];

function seeded(seed) {                    // a repeatable random number generator, so every brain gets the same worlds
  return () => { seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; };
}

function newWorld(brain, seed) {
  const rand = seeded(seed);
  return {
    brain, rand, pos: 50, food: rand() * 100, eaten: 0, closer: 0, left: 0, right: 0, tick: 0, sensors: [0, 0],
    state: { charge: brain.neurons.map(() => 0), spikes: brain.neurons.map(() => false) },
  };
}

function stepWorld(w) {
  w.sensors = [w.food < w.pos ? 1 : 0, w.food > w.pos ? 1 : 0];
  const motors = think(w.brain, w.state, w.sensors);
  w.left = 0.8 * w.left + 0.2 * Math.max(0, motors[0]);     // smooth the motor spikes into a speed
  w.right = 0.8 * w.right + 0.2 * Math.max(0, motors[1]);
  const before = Math.abs(w.food - w.pos);
  w.pos = Math.min(100, Math.max(0, w.pos + 2 * (w.right - w.left)));
  w.closer += before - Math.abs(w.food - w.pos);
  if (Math.abs(w.food - w.pos) < 2) { w.eaten++; w.food = w.rand() * 100; }
  w.tick++;
}

function score(brain) {                    // average over the test worlds
  if (!brain) return 0;
  let total = 0;
  for (const seed of TEST_WORLDS) {
    const w = newWorld(brain, seed);
    while (w.tick < TICKS) stepWorld(w);
    total += w.eaten + w.closer / 100;
  }
  return total / TEST_WORLDS.length;
}

// ===== STEP 7: evolution =====
// Score every DNA string, keep the best few unchanged, and fill the rest with mutated copies of them.
const POP = 60, KEEP = 8;
const pick = s => s[Math.floor(Math.random() * s.length)];

function randomDNA() {                     // 3 genes of 9–12 codons, with a few junk letters between them
  let dna = '';
  for (let g = 0; g < 3; g++) {
    dna += 'CC' + 'ATG';
    for (let k = 9 + Math.floor(Math.random() * 4); k > 0; k--) {
      let codon;
      do codon = pick(BASES) + pick(BASES) + pick(BASES); while (STOPS.includes(codon));
      dna += codon;
    }
    dna += pick(STOPS);
  }
  return dna;
}

function mutate(dna) {                     // each letter has a 1 in 30 chance of changing
  return [...dna].map(b => (Math.random() < 1 / 30 ? pick(BASES.replace(b, '')) : b)).join('');
}

let population, generation, best;

function startOver() {
  population = Array.from({ length: POP }, randomDNA);
  generation = 0;
  best = { dna: population[0], fitness: 0 };
}

function nextGeneration() {
  const scored = population.map(dna => ({ dna, fitness: score(grow(dna)) })).sort((a, b) => b.fitness - a.fitness);
  const parents = scored.slice(0, KEEP).map(s => s.dna);
  population = [...parents];
  while (population.length < POP) population.push(mutate(pick(parents)));
  generation++;
  return scored[0];
}

// ===== STEP 8: drawing and buttons =====
const $ = id => document.getElementById(id);
let evolving = false, live = null;

function colours() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return { ink: v('--ink'), muted: v('--muted'), line: v('--line'), panel: v('--panel'), accent: v('--accent'), sensor: v('--sensor'), motor: v('--motor'),
    types: [v('--t0'), v('--t1'), v('--t2'), v('--t3')] };
}

function sizeCanvas(canvas) {
  const r = canvas.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: r.width, h: r.height };
}

function drawBrain(brain, world) {
  const { ctx, w } = sizeCanvas($('brain')), col = colours(), cell = w / SIZE;
  const at = p => [(p.x + 0.5) * cell, (p.y + 0.5) * cell];
  const line = (a, b, weight) => {
    ctx.strokeStyle = weight >= 0 ? col.accent : col.motor;
    ctx.globalAlpha = 0.35; ctx.lineWidth = 0.5 + Math.abs(weight);
    ctx.beginPath(); ctx.moveTo(...at(a)); ctx.lineTo(...at(b)); ctx.stroke(); ctx.globalAlpha = 1;
  };
  for (const l of brain.links) line(brain.neurons[l.from], brain.neurons[l.to], l.weight);
  for (const s of brain.inputs) line(SENSORS[s.sensor], brain.neurons[s.to], s.weight);
  for (const o of brain.outputs) line(brain.neurons[o.from], MOTORS[o.motor], o.weight);
  brain.neurons.forEach((n, i) => {
    const spiking = world && world.state.spikes[i];
    ctx.fillStyle = col.types[n.type];
    ctx.globalAlpha = spiking ? 1 : 0.55;
    ctx.beginPath(); ctx.arc(...at(n), cell * (spiking ? 0.42 : 0.32), 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;
  ctx.font = '11px system-ui, sans-serif'; ctx.textAlign = 'center';
  [[SENSORS, col.sensor, world && world.sensors], [MOTORS, col.motor, world && [world.left, world.right]]].forEach(([parts, colour, levels]) => {
    parts.forEach((p, k) => {
      const [x, y] = at(p), s = cell * 0.7;
      ctx.fillStyle = colour; ctx.globalAlpha = levels ? 0.3 + 0.7 * Math.min(1, levels[k] * 2) : 1;
      ctx.fillRect(x - s / 2, y - s / 2, s, s); ctx.globalAlpha = 1;
      const ty = p.y === 0 ? y + s : y - s * 0.75, tw = ctx.measureText(p.name).width;
      ctx.fillStyle = col.panel; ctx.fillRect(x - tw / 2 - 3, ty - 10, tw + 6, 14);   // keep the label readable over neurons
      ctx.fillStyle = col.muted; ctx.fillText(p.name, x, ty);
    });
  });
}

function drawWorld(world) {
  const { ctx, w, h } = sizeCanvas($('world')), col = colours();
  const x = p => 16 + (w - 32) * p / 100, y = h * 0.6;
  ctx.strokeStyle = col.line; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x(0), y); ctx.lineTo(x(100), y); ctx.stroke();
  ctx.fillStyle = col.types[1]; ctx.beginPath(); ctx.arc(x(world.food), y, 6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = col.accent; ctx.beginPath(); ctx.arc(x(world.pos), y, 10, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = col.ink; ctx.font = '13px ui-monospace, Menlo, monospace'; ctx.textAlign = 'left';
  ctx.fillText(`tick ${world.tick} / ${TICKS}   food eaten ${world.eaten}`, 16, 24);
}

function showChampion() {
  const brain = grow(best.dna);
  $('dna').textContent = `Champion DNA (generation ${generation}):\n${best.dna}`;
  $('rules').textContent = brain
    ? brain.rules.map((r, t) => `Type ${t}: ${JSON.stringify(r, (k, v) => (typeof v === 'number' ? +v.toFixed(2) : v))}`).join('\n') +
      `\n${brain.neurons.length} neurons, ${brain.links.length} links, ${brain.inputs.length} sensor inputs, ${brain.outputs.length} motor outputs`
    : 'No genes found.';
  live = brain ? newWorld(brain, 99) : null;
}

function frame() {
  if (evolving) {
    const top = nextGeneration();
    if (top.fitness > best.fitness || generation === 1) { best = top; showChampion(); }
    $('stats').textContent = `generation ${generation} · champion scores ${best.fitness.toFixed(1)}`;
  }
  if (live) {
    for (let k = 0; k < 2; k++) { stepWorld(live); if (live.tick >= TICKS) live = newWorld(live.brain, 99); }
    drawBrain(live.brain, live);
    drawWorld(live);
  }
  requestAnimationFrame(frame);
}

$('evolve').addEventListener('click', () => {
  evolving = !evolving;
  $('evolve').textContent = evolving ? 'Pause' : 'Keep evolving';
});
$('reset').addEventListener('click', () => { startOver(); showChampion(); $('stats').textContent = 'generation 0'; });

startOver();
showChampion();
$('stats').textContent = 'generation 0 · press Start evolving';
requestAnimationFrame(frame);
</script>
